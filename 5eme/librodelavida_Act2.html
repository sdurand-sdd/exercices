const inputs=[...document.querySelectorAll('.answer')];
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').trim().replace(/\s+/g,' ').replace(/[.!¡¿?]/g,'');
const fb=document.querySelector('#feedback');
function check(){let correct=0;for(const el of inputs){const good=normalize(el.value)===normalize(el.dataset.answer);el.classList.toggle('good',good);el.classList.toggle('bad',!good);if(good)correct++}fb.className='feedback '+(correct===inputs.length?'ok':'no');fb.textContent=correct===inputs.length?'¡Excelente! ¡Todas las respuestas son correctas! 🎉':`${correct} / ${inputs.length} respuestas correctas. ¡Inténtalo otra vez!`;if(correct===inputs.length)celebrate()}
function reset(){for(const el of inputs){el.value='';el.classList.remove('good','bad')}fb.textContent='';fb.className='feedback';inputs[0].focus()}
function reveal(){for(const el of inputs){el.value=el.dataset.answer;el.classList.add('good');el.classList.remove('bad')}fb.className='feedback ok';fb.textContent='Corrección affichée : lis les phrases et recopie-les dans ton cahier.'}
function celebrate(){const emojis=['🎉','🌸','✨','🎊'];for(let i=0;i<28;i++){const s=document.createElement('span');s.textContent=emojis[i%emojis.length];s.style.cssText=`position:fixed;z-index:100;left:${Math.random()*100}vw;top:-35px;font-size:${18+Math.random()*18}px;pointer-events:none;transition:transform 2.3s ease-in,opacity 2.3s`;document.body.append(s);requestAnimationFrame(()=>{s.style.transform=`translateY(${innerHeight+80}px) rotate(${Math.random()*720}deg)`;s.style.opacity='0'});setTimeout(()=>s.remove(),2500)}}
document.querySelector('#check').onclick=check;document.querySelector('#reset').onclick=reset;document.querySelector('#reveal').onclick=reveal;document.querySelector('#fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};inputs.forEach((el,i)=>{el.addEventListener('input',()=>el.classList.remove('good','bad'));el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(i<inputs.length-1)inputs[i+1].focus();else check()}})});
</script></body></html>
