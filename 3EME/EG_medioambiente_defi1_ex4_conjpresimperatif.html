<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> EG - Medio ambiente : Misión 1 - Ejercicio 4 - Conjugar presente imperativo </title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* Design général */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 5px; 
            background-color: #f0f2f5; 
            color: #333;
        }
        
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        
        /* Conteneur des deux tableaux */
        .container { 
            display: flex; 
            justify-content: center; 
            gap: 5px; 
            flex-wrap: wrap; 
        }

        table { 
            border-collapse: collapse; 
            background: white; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        th, td { 
            border: 1px solid #dee2e6; 
            padding: 4px 4px; 
            text-align: left; 
        }

        th { 
            background-color: #4a69bd; 
            color: white; 
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* Style des cases de saisie */
        input { 
            border: 2px solid #bdc3c7; 
            padding: 3px; 
            border-radius: 5px;
            width: 170px;
            font-size: 1.1rem; 
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }

        input:focus { border-color: #4a69bd; background-color: #f8f9fa; }

        /* Couleurs de correction instantanée */
        .correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .incorrect { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }

        /* Zone de contrôle et Score */
        .controls { text-align: center; margin-top: 10px; padding-bottom: 20px; }
        
        #resultat { 
            font-size: 1.6rem; 
            font-weight: bold; 
            margin-bottom: 5px; 
            min-height: 2rem;
        }

        button { 
            padding: 6px 10px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            background-color: #2ecc71; 
            color: white; 
            border: none; 
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            font-weight: bold;
        }

        button:hover { background-color: #27ae60; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        u { text-decoration-color: #e74c3c; text-decoration-thickness: 2px; }

        /* Encadré code secret */
        .code-escape-game {
            background-color: #fff9c4;
            border: 2px dashed #fbc02d;
            padding: 8px 16px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 5px;
            border-radius: 8px;
            display: inline-block;
            color: #2c3e50;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>Exercice de Conjugaison - Présent impératif</h1>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Infinitif</th>
                    <th>Pers.</th>
                    <th>Réponse</th>
                </tr>
            </thead>
            <tbody id="table1"></tbody>
        </table>

        <table>
            <thead>
                <tr>
                    <th>Infinitif</th>
                    <th>Pers.</th>
                    <th>Réponse</th>
                </tr>
            </thead>
            <tbody id="table2"></tbody>
        </table>
    </div>

    <div class="controls">
        <div id="resultat"></div>
        <button onclick="verifierTout()">¡VERIFICAR MISIÓN!</button>
    </div>

    <script>
        const exercices = [
            { v: "PRESERVAR", p: "5", r: "preservad" },
            { v: "PROTEGER", p: "6", r: "protejan" },
            { v: "P<i>E</i>DIR*", p: "2", r: "pide" },
            
            { v: "RESPETAR", p: "5", r: "respetad" },
            { v: "CONOCER", p: "3", r: "conozca" },
            { v: "VIVIR", p: "6", r: "vivan" },
            
            { v: "UTILIZAR", p: "6", r: "utilicen" },
            { v: "CORRER", p: "4", r: "corramos" },
            { v: "S<i>E</i>GUIR", p: "3", r: "siga" },
            
            { v: "RECICLAR", p: "3", r: "recicle" },
            // Table 2
            { v: "APRENDER", p: "5", r: "aprended" },
            { v: "DESTRUÍR", p: "4", r: "destruyamos" },
            
            { v: "EXPLICAR", p: "6", r: "expliquen" },
            { v: "ACCEDER", p: "6", r: "accedan" },
            { v: "DIRIGIR", p: "4", r: "dirijamos" },
            
            { v: "C<u>E</u>RRAR", p: "6", r: "cierren" },            
            { v: "EXISTIR", p: "5", r: "existid" },
            { v: "RECOGER", p: "2", r: "recoge" },
            
            { v: "APAGAR", p: "3", r: "apague" },
            { v: "DISTINGUIR", p: "2", r: "distingue" }
        ];

        const audioPerfect = new Audio('https://actions.google.com/sounds/v1/human_voices/applause.ogg');
        const nettoyer = (text) => text.trim().toLowerCase().replace(/\s+/g, ' ');

        // Génération des tableaux
        function genererTableaux() {
            const t1 = document.getElementById('table1');
            const t2 = document.getElementById('table2');

            exercices.forEach((ex, index) => {
                const row = `<tr>
                    <td>${ex.v}</td>
                    <td>${ex.p}</td>
                    <td>
                        <input type="text" 
                               id="input-${index}" 
                               autocomplete="off" 
                               spellcheck="false"
                               onblur="corrigerCase(${index})"
                               onkeydown="if(event.key==='Enter') passerSuivant(${index})">
                    </td>
                </tr>`;
                if (index < 10) t1.innerHTML += row;
                else t2.innerHTML += row;
            });
        }

        // Fonction de correction individuelle (déclenchée dès qu'on quitte la case)
        function corrigerCase(index) {
            const input = document.getElementById(`input-${index}`);
            const valeurEleve = nettoyer(input.value);
            
            // Si la case est vide, on retire les couleurs de correction
            if (valeurEleve === "") {
                input.className = "";
                return;
            }

            if (valeurEleve === nettoyer(exercices[index].r)) {
                input.className = "correct";
            } else {
                input.className = "incorrect";
            }
        }

        function passerSuivant(index) {
            const actuel = document.getElementById(`input-${index}`);
            // Forcer la correction de la case actuelle avant de passer à la suite
            corrigerCase(index); 
            
            const suivant = document.getElementById(`input-${index + 1}`);
            if (suivant) suivant.focus();
        }

        // Fonction globale finale pour le bouton
        function verifierTout() {
            let score = 0;

            exercices.forEach((ex, index) => {
                const input = document.getElementById(`input-${index}`);
                // On recalcule proprement au cas où
                corrigerCase(index);
                if (input.classList.contains("correct")) {
                    score++;
                }
            });

            const zoneScore = document.getElementById('resultat');
            
            if (score === exercices.length) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                try { audioPerfect.play(); } catch(e) {}
                
                zoneScore.style.color = "#27ae60";
                zoneScore.innerHTML = `🏆 Score : ${score} / ${exercices.length} - ¡Excelente! 🎉<br>
                <div class="code-escape-game">🔑 CODE SECRET : VERBOS-IMPERATIVO</div>`;
            } else {
                zoneScore.style.color = "#c0392b";
                zoneScore.innerHTML = `Score : ${score} / ${exercices.length} <br><span style="font-size: 1.1rem; font-weight: normal;">Corrige las casillas rojas para desbloquear el código secreto.</span>`;
            }
        }

        window.onload = genererTableaux;
    </script>
</body>
</html>
