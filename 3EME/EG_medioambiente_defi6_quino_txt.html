<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EG - Operación Gaia: Ordena la historia</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-light: #e8f5e9;
            --bg-color: transparent;
            --card-bg: #ffffff;
            --accent-color: #ff9800;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 5px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: auto;
            padding: 6px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            font-size: 16px;
            text-align: center;
            margin: 2px 0 6px 0;
        }

        .instructions {
            background-color: var(--primary-light);
            color: #1b5e20;
            padding: 5px 7px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 6px;
            line-height: 1.1;
            text-align: center;
        }

        #sortable-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .story-item {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-left: 4px solid var(--primary-color);
            border-radius: 5px;
            padding: 4px 7px;
            font-size: 12.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .item-text {
            flex: 1;
            line-height: 1.1;
        }

        .nav-btns {
            display: flex;
            flex-direction: row;
            gap: 4px;
        }

        .nav-btn {
            background: #eeeeee;
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 6px 9px;
            font-size: 13px;
            font-weight: bold;
            color: #333333;
            cursor: pointer;
            touch-action: manipulation; 
            user-select: none;
        }
        
        .nav-btn:active {
            background: #d5d5d5;
        }

        .btn-container {
            display: flex;
            gap: 8px;
            margin-top: 7px;
        }

        button.main-btn {
            flex: 1;
            padding: 6px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .validate-btn { background-color: var(--primary-color); color: white; }
        .validate-btn:hover { background-color: #1b5e20; }
        .reset-btn { background-color: #e0e0e0; color: #333; }
        .reset-btn:hover { background-color: #ccc; }

        .result-box {
            margin-top: 8px;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
            font-size: 13px;
        }

        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 2px dashed #4caf50;
        }

        .error-box {
            background-color: #ffebee;
            color: #c62828;
            border: 2px dashed #f44336;
        }

        .code-box {
            background-color: #fff9c4;
            border: 2px dashed #fbc02d;
            padding: 4px;
            font-size: 14px;
            margin-top: 4px;
            display: inline-block;
            letter-spacing: 1px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⏳ Misión: Cronología de la Historia</h1>
    
    <div class="instructions">
        <strong>¿Qué pasó primero?</strong> Ordena la historia utilizando los botones laterales 🔼 y 🔽 para mover las frases.
    </div>

    <ul id="sortable-list">
    </ul>

    <div class="btn-container">
        <button class="main-btn reset-btn" onclick="initExercise()">🔄 Reiniciar</button>
        <button class="main-btn validate-btn" onclick="checkOrder()">Comprobar ➔</button>
    </div>

    <div id="result" class="result-box"></div>
</div>

<script>
    // ==========================================
    // 1. SÉCURITÉ ANTI-TRICHE
    // ==========================================
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', function(e) {
        if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) || (e.ctrlKey && e.key === "u")) {
            e.preventDefault();
            return false;
        }
    });

    const decoder = (str) => decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));

    // ==========================================
    // 2. CHRONOLOGIE ET NOUVELLES FORMULATIONS ENCODÉES
    // ==========================================
    const encryptedStory = [
        "TGFzIGNoaW1lbmVhcyBkZSB1bmEgZsOhYnJpY2EgY29udGFtaW5hbiBlbCBhaXJlIGNvbiB1biBodW1vIG5lZ3JvIHkgZGVuc28u", // 1. Las chimeneas...
        "VW4gaG9tYnJlIGNhbWluYSBwb3IgbGEgY2FsbGUgeSBlbXBpZXphIGEgdG9zZXIgYSBjYXVzYSBkZSBsYSBjb250YW1pbmFjacOzbi4=", // 2. Un hombre camina...
        "RWwgaG9tYnJlIGVuZmVybW8gZGVjaWRlIHRvY2FyIGEgbGEgcHVlcnRhIGRlIGxhIGNvbnN1bHRhIGRlIHVuIG1lZGljby4=", // 3. El hombre enfermo...
        "RWwgbcOpZGljbyBhdXNjdWx0YSBsb3MgcHVsbW9uZXMgZGVsIHBhY2llbnRlLCBxdWUgZXN0w6FuIGNvbXBsZXRhbWVudGUgbmVncm9zLg==", // 4. El médico ausculta...
        "RWwgbcOpZGljbyBlc2NyaWJlIHVuYSByZWNldGEgcGFyYSByZWNldGFyIHVuIGZyYXNjbyBkZSBwYXN0aWxsYXMgYWwgcGFjaWVudGUu", // 5. El médico escribe...
        "RWwgaG9tYnJlIHNhbGUgY29ycmllbmRvIGhhY2lhIGxhIGZhcm1hY2lhIGNvbiBsYSByZWNldGEgZW4gbGEgbWFuby4=", // 6. El hombre sale corriendo...
        "RW4gbGEgZmFybWFjaWEsIGVsIHBhY2llbnRlIGxlIGRhIGxhIHJlY2V0YSBtw6lkaWNhIGFsIGZhcm1hY8OpdXRpY28u", // 7. En la farmacia...
        "RWwgZmFybWFjw6l1dGljbyBsZSBlbnRyZWdhIGVsIGZyYXNjbyBkZSBtZWRpY2FtZW50b3MgcGFyYSBjdXJhciBzdSB0b3Mu", // 8. El farmacéutico le entrega...
        "RWwgaG9tYnJlIHJlZ3Jlc2EgYSBsYSBjYWxsZSBhbGl2aWFkbyB5IG1pcmFuZG8gc3UgZnJhc2NvIGRlIHBhc3RpbGxhcy4=", // 9. El hombre regresa...
        "TGEgaW1hZ2VuIG11ZXN0cmEgbGEgZsOhYnJpY2EgZGUgbGVqb3MgcXVlIHNpZ3VlIGNvbnRhbWluYW5kbyBlbCBtZWRpbyBhbWJpZW50ZSAocGxhbm8gZ2VuZXJhbCku", // 10. REFORMULÉE (Vignette 10)
        "Tm9zIGFjZXJjYW1vcyBhIGxhIGbDoWJyaWNhIHkgdmVtb3MgdW5hIGVtcGxlYWRhIHRyYWJhamFuZG8gKHBsYW5vIG1lZGlvKS4=", // 11. REFORMULÉE (Vignette 11)
        "Tm9zIGFjZXJjYW1vcyB5IHZlbW9zIHF1ZSBsYSBmYWJyaWNhIHByb2R1Y2UgbGFzIHBhc3RpbGxhcyBxdWUgY3VyYW4gbGEgZW5mZXJtZWRhZCBxdWUgc3UgcHJvcGlhIGNvbnRhbWluYWNpw7NuIHByb3ZvY2Eu" // 12. REFORMULÉE (Vignette 12)
    ];
 
    const listContainer = document.getElementById('sortable-list');

    function initExercise() {
        document.getElementById('result').style.display = "none";
        listContainer.innerHTML = '';
        
        let itemsArray = encryptedStory.map((encryptedText, index) => ({ 
            text: decoder(encryptedText), 
            id: index 
        }));
        
        // Mélange Fisher-Yates
        for (let i = itemsArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [itemsArray[i], itemsArray[j]] = [itemsArray[j], itemsArray[i]];
        }

        itemsArray.forEach(item => {
            const li = document.createElement('li');
            li.className = 'story-item';
            li.setAttribute('data-id', item.id);
            
            li.innerHTML = `
                <div class="item-text">${item.text}</div>
                <div class="nav-btns">
                    <button class="nav-btn" onclick="moveUp(this)">🔼</button>
                    <button class="nav-btn" onclick="moveDown(this)">🔽</button>
                </div>
            `;
            listContainer.appendChild(li);
        });
    }

    function moveUp(btn) {
        const item = btn.closest('.story-item');
        const previous = item.previousElementSibling;
        if (previous) {
            listContainer.insertBefore(item, previous);
        }
    }

    function moveDown(btn) {
        const item = btn.closest('.story-item');
        const next = item.nextElementSibling;
        if (next) {
            listContainer.insertBefore(next, item);
        }
    }

    function checkOrder() {
        const currentItems = document.querySelectorAll('.story-item');
        let isCorrect = true;

        currentItems.forEach((item, index) => {
            const correctId = parseInt(item.getAttribute('data-id'));
            if (correctId !== index) {
                isCorrect = false;
            }
        });

        const resultBox = document.getElementById('result');
        resultBox.style.display = "block";

        if (isCorrect) {
            resultBox.className = "result-box success";
            const secretWinCode = decoder("Q1JPTk8tMjAyNg=="); 
            resultBox.innerHTML = `
                ¡Excelente trabajo! 🌟<br>
                Has ordenado la cronología perfectamente.<br>
                <div class="code-box">CÓDIGO : ${secretWinCode}</div>
            `;
        } else {
            resultBox.className = "result-box error-box";
            resultBox.innerHTML = `La historia no está en el orden correcto. ¡Inténtalo de nuevo! ❌`;
        }
    }

    initExercise();
</script>

</body>
</html>
