const items=[{"id": "cabeza", "label": "La cabeza", "x": 4.094, "y": 13.254, "w": 30.409, "h": 7.929}, {"id": "ojo", "label": "El ojo", "x": 4.094, "y": 23.787, "w": 28.889, "h": 8.047}, {"id": "boca", "label": "La boca", "x": 4.094, "y": 34.083, "w": 29.24, "h": 7.929}, {"id": "hombro", "label": "El hombro", "x": 4.094, "y": 43.905, "w": 29.123, "h": 7.929}, {"id": "dedo", "label": "El dedo", "x": 4.094, "y": 56.568, "w": 21.637, "h": 7.929}, {"id": "barriga", "label": "La barriga", "x": 4.094, "y": 73.846, "w": 30.76, "h": 7.929}, {"id": "pie", "label": "El pie", "x": 4.094, "y": 86.154, "w": 27.836, "h": 7.929}, {"id": "nariz", "label": "La nariz", "x": 78.012, "y": 12.663, "w": 19.532, "h": 8.166}, {"id": "oreja", "label": "La oreja", "x": 66.082, "y": 22.722, "w": 31.579, "h": 8.047}, {"id": "cuello", "label": "El cuello", "x": 66.082, "y": 32.899, "w": 31.345, "h": 8.047}, {"id": "brazo", "label": "El brazo", "x": 67.368, "y": 45.325, "w": 30.058, "h": 8.047}, {"id": "mano", "label": "La mano", "x": 71.345, "y": 56.213, "w": 25.965, "h": 8.166}, {"id": "rodilla", "label": "La rodilla", "x": 65.848, "y": 71.479, "w": 31.579, "h": 8.166}, {"id": "pierna", "label": "La pierna", "x": 65.848, "y": 83.195, "w": 31.696, "h": 7.929}];
const order=['rodilla','boca','pie','oreja','hombro','nariz','mano','cabeza','pierna','dedo','cuello','ojo','barriga','brazo'];
const byId=Object.fromEntries(items.map(i=>[i.id,i]));
const bank=document.querySelector('#bank'),board=document.querySelector('#board'),status=document.querySelector('#status'),score=document.querySelector('#score');
let selected=null,finished=new Set(),drag=null;
function setStatus(t,cls=''){status.textContent=t;status.className='status '+cls}
function pick(id){if(finished.has(id))return;selected=id;document.querySelectorAll('.chip').forEach(el=>el.classList.toggle('selected',el.dataset.id===id));setStatus('Étiquette sélectionnée : '+byId[id].label)}
function fill(id){if(finished.has(id))return;finished.add(id);document.querySelector('.chip[data-id="'+id+'"]').remove();const slot=document.querySelector('.slot[data-id="'+id+'"]');slot.classList.add('filled');slot.innerHTML='<span class="answer">'+byId[id].label+'</span>';selected=null;document.querySelectorAll('.chip').forEach(el=>el.classList.remove('selected'));score.textContent=finished.size+' / 14';if(finished.size===14){setStatus('¡Excelente! ¡Todo correcto! 🎉','done');celebrate()}else setStatus('¡Muy bien! '+finished.size+' de 14','done')}
function attempt(slot){if(!selected)return;const id=slot.dataset.id;if(id===selected){fill(id)}else{slot.classList.remove('bad');void slot.offsetWidth;slot.classList.add('bad');setStatus('Inténtalo otra vez.','error')}}
function make(){bank.innerHTML='';board.querySelectorAll('.slot').forEach(s=>s.remove());finished.clear();selected=null;score.textContent='0 / 14';setStatus('À vous de jouer !');for(const i of items){let s=document.createElement('div');s.className='slot';s.dataset.id=i.id;s.style.cssText=`left:${i.x}%;top:${i.y}%;width:${i.w}%;height:${i.h}%`;s.setAttribute('role','button');s.setAttribute('aria-label','Case à compléter');s.tabIndex=0;s.addEventListener('click',()=>attempt(s));s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();attempt(s)}});board.append(s)}for(const id of order){let b=document.createElement('button');b.className='chip';b.dataset.id=id;b.textContent=byId[id].label;b.addEventListener('click',()=>{if(b.dataset.suppress){delete b.dataset.suppress;return}pick(id)});b.addEventListener('pointerdown',e=>startDrag(e,id,b));bank.append(b)}}
function startDrag(e,id,el){if(e.button!==0)return;const sx=e.clientX,sy=e.clientY;let moved=false,ghost=null;const move=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8&&!moved)return;if(!moved){moved=true;pick(id);ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=byId[id].label;document.body.append(ghost)}ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'));let s=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot');if(s&&!s.classList.contains('filled'))s.classList.add('over');ev.preventDefault()};const up=ev=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'));if(ghost)ghost.remove();if(moved){let s=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot');if(s)attempt(s);el.dataset.suppress='1';setTimeout(()=>{if(el.isConnected)delete el.dataset.suppress},0)}};window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)}
// Native drag for mouse/trackpad; pointer handler also supports touch-screen smartboards.
document.querySelector('#reset').onclick=make;document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()};
function celebrate(){claps();const canvas=document.querySelector('#confetti'),ctx=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;let bits=Array.from({length:180},()=>({x:Math.random()*canvas.width,y:-Math.random()*canvas.height,vy:2+Math.random()*4,vx:-2+Math.random()*4,r:2+Math.random()*5,c:['#16a6d3','#ffcb2f','#ed5d97','#45bd77','#8c68cf'][Math.floor(Math.random()*5)]}));let start=performance.now();function frame(now){ctx.clearRect(0,0,canvas.width,canvas.height);for(const p of bits){p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r*1.6)}if(now-start<3700)requestAnimationFrame(frame);else ctx.clearRect(0,0,canvas.width,canvas.height)}requestAnimationFrame(frame)}
function claps(){try{const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();let now=ac.currentTime;for(let k=0;k<16;k++){let t=now+k*.12;let length=.065;let buffer=ac.createBuffer(1,Math.floor(ac.sampleRate*length),ac.sampleRate);let d=buffer.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);let src=ac.createBufferSource();src.buffer=buffer;let f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=850;let g=ac.createGain();g.gain.value=.12+Math.random()*.08;src.connect(f);f.connect(g);g.connect(ac.destination);src.start(t)}setTimeout(()=>ac.close(),3000)}catch(e){}}
make();
