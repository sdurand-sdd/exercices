<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: transparent;
            margin: 0;
            padding: 5px; /* Réduit pour gagner de la hauteur */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-wrapper {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 12px; /* Réduit */
            max-width: 780px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }
        .game-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px; /* Réduit */
        }
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            background: #f1f8e9;
            border-radius: 8px;
            width: 175px;
            height: 440px; /* Légèrement réduit pour compacter */
            overflow-y: auto;
            box-sizing: border-box;
            text-align: left;
        }
        .word-item {
            font-size: 11px;
            font-weight: bold;
            color: #555;
            background: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #c8e6c9;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .word-item.found {
            text-decoration: line-through;
            background: #c8e6c9;
            color: #2e7d32;
            border-color: #a5d6a7;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(16, 26px); /* Cellules à 26px au lieu de 27px */
            grid-template-rows: repeat(16, 26px);
            gap: 2.5px;
            background: #e0e0e0;
            padding: 5px;
            border-radius: 8px;
        }
        .cell {
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .cell.start-selected { background: #ffb74d !important; color: #000; }
        .cell.hover-selected { background: #ffe082; color: #000; }
        .cell.found-word { background: #b2dfdb !important; color: #00695c !important; }
        
        .instructions {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            font-style: italic;
        }
        .btn-check {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .btn-check:hover { background: #388e3c; }
        
        .resultado {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }
        .code-box {
            background-color: #fff9c4;
            border: 2px dashed #fbc02d;
            padding: 6px;
            font-size: 18px;
            margin-top: 6px;
            border-radius: 6px;
            display: inline-block;
            letter-spacing: 2px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <h3 style="margin:0 0 4px 0; color:#2e7d32;">🔍 Misión: Sopa de Letras del Medio Ambiente</h3>
    <div class="instructions">Instrucciones: Haz clic en la <b>primera letra</b> de una palabra y luego en la <b>última letra</b> para validarla.</div>
    
    <div class="game-layout">
        <div class="word-list" id="words-ui"></div>
        <div class="grid-container" id="grid-ui"></div>
    </div>
    
    <button class="btn-check" onclick="verificarFinal()">Comprobar Sopa de Letras</button>
    <div id="resultado-box" class="resultado"></div>
</div>

<script>
    const palabrasObjetivo = [
        "MEDIOAMBIENTE", "CONTAMINACION", "PRESERVAR", "EXTINCION", "PLANETA", 
        "RECICLAR", "CUIDAR", "DESTRUIR", "BIODEGRADABLE", "ENERGIARENOVABLE", 
        "DEFORESTACION", "DESECHOS", "MATANZA", "PELIGRO", "TIERRA", 
        "HUMANIDAD", "TOMARCONCIENCIA", "ECOLOGIA", "BASURA"
    ];

    const matrizLetras = [
        ['E','U','M','O','Q','P','R','E','S','E','R','V','A','R','Z','A'],
        ['G','N','A','I','X','D','E','S','T','R','U','I','R','E','I','J'],
        ['B','T','E','A','E','P','A','N','I','D','X','Q','B','C','P','M'],
        ['D','I','N','R','U','X','R','D','A','T','K','G','N','I','L','E'],
        ['E','E','O','E','G','A','T','D','E','A','I','E','H','C','A','D'],
        ['F','R','I','D','D','I','I','I','X','S','I','O','E','L','N','I'],
        ['O','R','A','I','E','N','A','P','N','C','E','W','P','A','E','O'],
        ['R','A','U','X','A','G','I','R','N','C','X','C','X','R','T','A'],
        ['E','C','M','M','C','F','R','O','E','B','I','U','H','X','A','M'],
        ['S','H','U','C','K','B','C','A','P','N','A','O','K','O','I','B'],
        ['T','H','F','M','J','R','P','S','D','E','O','S','N','J','S','I'],
        ['A','M','A','T','A','N','Z','A','A','A','L','V','U','O','S','E'],
        ['C','O','G','M','B','U','E','O','U','Z','B','I','A','R','N','N'],
        ['I','F','O','A','T','U','R','M','O','P','A','L','G','B','A','T'],
        ['O','T','E','C','O','L','O','G','I','A','C','O','E','R','L','E'],
        ['N','C','O','N','T','A','M','I','N','A','C','I','O','N','O','E']
    ];

    let palabrasEncontradas = new Set();
    let startCell = null;
    let cellElements = [];

    function iniciarJuego() {
        const gridUi = document.getElementById('grid-ui');
        const wordsUi = document.getElementById('words-ui');
        
        palabrasObjetivo.sort().forEach(word => {
            const span = document.createElement('span');
            span.className = 'word-item';
            span.id = `word-${word}`;
            span.innerText = word === "ENERGIARENOVABLE" ? "ENERGÍA RENOVABLE" : word === "TOMARCONCIENCIA" ? "TOMAR CONCIENCIA" : word === "CONTAMINACION" ? "CONTAMINACIÓN" : word === "EXTINCION" ? "EXTINCIÓN" : word === "ECOLOGIA" ? "ECOLOGÍA" : word === "DEFORESTACION" ? "DEFORESTACIÓN" : word;
            wordsUi.appendChild(span);
        });

        for (let r = 0; r < 16; r++) {
            cellElements[r] = [];
            for (let c = 0; c < 16; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = matrizLetras[r][c];
                cell.dataset.row = r;
                cell.dataset.col = c;
                
                cell.onclick = () => handleCellClick(r, c);
                cell.onmouseenter = () => handleCellHover(r, c);
                
                gridUi.appendChild(cell);
                cellElements[r][c] = cell;
            }
        }
    }

    function handleCellClick(r, c) {
        if (!startCell) {
            startCell = { r, c };
            cellElements[r][c].classList.add('start-selected');
        } else {
            let cellsSelected = getLineCells(startCell.r, startCell.
