        :root {

            --bg-color: #f4f7f5;

            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        .progress-bar {
            background-color: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%; 
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            font-weight: 500;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background-color: var(--primary-light);
        }

        .option-item.correct {
            border-color: var(--correct-color);
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .option-item.incorrect {
            border-color: var(--incorrect-color);
            background-color: #ffebee;
            color: #c62828;
        }

        .option-item.disabled {
            pointer-events: none;
        }

        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.3;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct-fb {
            background-color: #e8f5e9;
            border-left: 5px solid var(--correct-color);
            color: #1b5e20;
        }

        .feedback.incorrect-fb {
            background-color: #ffebee;
            border-left: 5px solid var(--incorrect-color);
            color: #b71c1c;
        }

        .next-btn {
            display: none;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background-color: var(--secondary-color);
        }

        .final-screen {
            text-align: center;
            display: none;
        }

        .final-screen h2 {
            color: var(--primary-color);
            font-size: 28px;
        }

        .code-box {
            background-color: #fff9c4;
            border: 2px dashed #fbc02d;
            padding: 8px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>
