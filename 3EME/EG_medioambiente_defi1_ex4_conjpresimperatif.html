<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> EG - Medio ambiente : Misión 1 - Ejercicio 4 - Conjugar presente imperativo </title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* Design général */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 5px; 
            background-color: #f0f2f5; 
            color: #333;
        }
        
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        
        /* Conteneur des deux tableaux */
        .container { 
            display: flex; 
            justify-content: center; 
            gap: 5px; 
            flex-wrap: wrap; 
        }

        table { 
            border-collapse: collapse; 
            background: white; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        th, td { 
            border: 1px solid #dee2e6; 
            padding: 4px 4px; 
            text-align: left; 
        }

        th { 
            background-color: #4a69bd; 
            color: white; 
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        /* Style des cases de saisie */
        input { 
            border: 2px solid #bdc3c7; 
            padding: 3px; 
            border-radius: 5px;
            width: 170px;
            font-size: 1.1rem; 
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }

        input:focus { border-color: #4a69bd; background-color: #f8f9fa; }

        /* Couleurs de correction instantanée */
        .correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .incorrect { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }

        /* Zone de contrôle et Score */
        .controls { text-align: center; margin-top: 10px; padding-bottom: 20px; }
        
        #resultat { 
            font-size: 1.6rem; 
            font-weight: bold; 
            margin-bottom: 5px; 
            min-height: 2rem;
        }

        button { 
            padding: 6px 10px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            background-color: #2ecc71; 
            color: white; 
            border: none; 
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            font-weight: bold;
        }

        button:hover { background-color: #27ae60; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        u { text-decoration-color: #e74c3c; text-decoration-thickness: 2px; }

        /* Encadré code secret */
        .code-escape-game {
            background-color: #fff9c4;
            border: 2px dashed #fbc02d;
            padding: 8px 16px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 5px;
            border-radius: 8px;
            display: inline-block;
            color: #2c3e50;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>Exercice de Conjugaison - Présent impératif</h1>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Infinitif</th>
                    <th>Pers.</th>
                    <th>Réponse</th>
                </tr>
            </thead>
            <tbody id="table1"></tbody>
        </table>

        <table>
            <thead>
                <tr>
                    <th>Infinitif</th>
                    <th>Pers.</th>
                    <th>Réponse</th>
                </tr>
            </thead>
            <tbody id="table2"></tbody>
        </table>
    </div>

    <div class="controls">
        <div id="resultat"></div>
        <button onclick="verifierTout()">¡VERIFICAR MISIÓN!</button>
    </div>

    <script>
    // ==========================================
    // 1. SÉCURITÉ ANTI-TRICHE (CLIC DROIT & CLAVIER)
    // ==========================================
    document.addEventListener('contextmenu', event => event.preventDefault());

    document.addEventListener('keydown', function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) ||
            (e.ctrlKey && e.key === "u")
        ) {
            e.preventDefault();
            return false;
        }
    });

    // ==========================================
    // 2. LOGIQUE ET DONNÉES SÉCURISÉES
    // ==========================================
    const decoder = (str) => decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));

    // Toutes les réponses attendues cachées en Base64
    const exercices = [
        { v: "PRESERVAR", p: "5", r: decoder("cHJlc2VydmFk") },
        { v: "PROTEGER", p: "6", r: decoder("cHJvdGVqYW4=") },
        { v: "P<i>E</i>DIR*", p: "2", r: decoder("cGlkZQ==") },
        
        { v: "RESPETAR", p: "5", r: decoder("cmVzcGV0YWQ=") },
        { v: "CONOCER", p: "3", r: decoder("Y29ub3pjYQ==") },
        { v: "VIVIR", p: "6", r: decoder("dml2YW4=") },
        
        { v: "UTILIZAR", p: "6", r: decoder("dXRpbGljZW4=") },
        { v: "CORRER", p: "4", r: decoder("Y29ycmFtb3M=") },
        { v: "S<i>E</i>GUIR", p: "3", r: decoder("c2lnYQ==") },
        
        { v: "RECICLAR", p: "3", r: decoder("cmVjaWNsZQ==") },
        // Table 2
        { v: "APRENDER", p: "5", r: decoder("YXByZW5kZWQ=") },
        { v: "DESTRUÍR", p: "4", r: decoder("ZGVzdHJ1eWFtb3M=") },
        
        { v: "EXPLICAR", p: "6", r: decoder("ZXhwbGlxdWVu") },
        { v: "ACCEDER", p: "6", r: decoder("YWNjZWRhbg==") },
        { v: "DIRIGIR", p: "4", r: decoder("ZGlyaWphbW9z") },
        
        { v: "C<u>E</u>RRAR", p: "6", r: decoder("Y2llcnJlbg==") },            
        { v: "EXISTIR", p: "5", r: decoder("ZXhpc3RpZA==") },
        { v: "RECOGER", p: "2", r: decoder("cmVjb2dl") },
        
        { v: "APAGAR", p: "3", r: decoder("YXBhZ3Vl") },
        { v: "DISTINGUIR", p: "2", r: decoder("ZGlzdGluZ3Vl") }
    ];

    const audioPerfect = new Audio('https://actions.google.com/sounds/v1/human_voices/applause.ogg');
    const nettoyer = (text) => text.trim().toLowerCase().replace(/\s+/g, ' ');

    // Génération des tableaux
    function genererTableaux() {
        const t1 = document.getElementById('table1');
        const t2 = document.getElementById('table2');

        exercices.forEach((ex, index) => {
            const row = `<tr>
                <td>${ex.v}</td>
                <td>${ex.p}</td>
                <td>
                    <input type="text" 
                           id="input-${index}" 
                           autocomplete="off" 
                           spellcheck="false"
                           onblur="corrigerCase(${index})"
                           onkeydown="if(event.key==='Enter') passerSuivant(${index})">
                </td>
            </tr>`;
            if (index < 10) t1.innerHTML += row;
            else t2.innerHTML += row;
        });
    }

    // Fonction de correction individuelle (déclenchée dès qu'on quitte la case)
    function corrigerCase(index) {
        const input = document.getElementById(`input-${index}`);
        const valeurEleve = nettoyer(input.value);
        
        if (valeurEleve === "") {
            input.className = "";
            return;
        }

        // Comparaison avec la réponse décodée de manière transparente
        if (valeurEleve === nettoyer(exercices[index].r)) {
            input.className = "correct";
        } else {
            input.className = "incorrect";
        }
    }

    function passerSuivant(index) {
        corrigerCase(index); 
        
        const suivant = document.getElementById(`input-${index + 1}`);
        if (suivant) suivant.focus();
    }

    // Fonction globale finale pour le bouton
    function verifierTout() {
        let score = 0;

        exercices.forEach((ex, index) => {
            const input = document.getElementById(`input-${index}`);
            corrigerCase(index);
            if (input.classList.contains("correct")) {
                score++;
            }
        });

        const zoneScore = document.getElementById('resultat');
        
        if (score === exercices.length) {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            try { audioPerfect.play(); } catch(e) {}
            
            zoneScore.style.color = "#27ae60";
            // Code secret décodé à la volée ("VkVSQk9TLVBNUEVSQVRJVk8=")
            zoneScore.innerHTML = `🏆 Score : ${score} / ${exercices.length} - ¡Excelente! 🎉<br>
            <div class="code-escape-game">🔑 CODE SECRET : ${decoder("VkVSQk9TLUlNUEVSQVRJVk8=")}</div>`;
        } else {
            zoneScore.style.color = "#c0392b";
            zoneScore.innerHTML = `Score : ${score} / ${exercices.length} <br><span style="font-size: 1.1rem; font-weight: normal;">Corrige las casillas rojas para desbloquear el código secreto.</span>`;
        }
    }

    window.onload = genererTableaux;
</script>
</body>
</html>
