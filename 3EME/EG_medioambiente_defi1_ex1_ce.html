<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EG - Medio ambiente : Misión 1 -  CE : Tu pueblo es tu planeta</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-light: #e8f5e9;
            --secondary-color: #388e3c;
            --text-color: #333;
            --bg-color: #f4f7f5;
            --card-bg: #ffffff;
            --correct-color: #4caf50;
            --incorrect-color: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        .progress-bar {
            background-color: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%; 
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            font-weight: 500;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background-color: var(--primary-light);
        }

        .option-item.correct {
            border-color: var(--correct-color);
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .option-item.incorrect {
            border-color: var(--incorrect-color);
            background-color: #ffebee;
            color: #c62828;
        }

        .option-item.disabled {
            pointer-events: none;
        }

        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.3;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct-fb {
            background-color: #e8f5e9;
            border-left: 5px solid var(--correct-color);
            color: #1b5e20;
        }

        .feedback.incorrect-fb {
            background-color: #ffebee;
            border-left: 5px solid var(--incorrect-color);
            color: #b71c1c;
        }

        .next-btn {
            display: none;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background-color: var(--secondary-color);
        }

        .final-screen {
            text-align: center;
            display: none;
        }

        .final-screen h2 {
            color: var(--primary-color);
            font-size: 28px;
        }

        .code-box {
            background-color: #fff9c4;
            border: 2px dashed #fbc02d;
            padding: 8px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="header">
            <h1>🌍 Misión 1: Comprensión lectora</h1>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="question-text" id="question-text">Question...</div>
         
        <ul class="options-list" id="options-list"></ul>

        <div class="feedback" id="feedback-box">Rationale...</div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Siguiente pregunta ➔</button>
    </div>

    <div id="final-screen" class="final-screen"></div>
</div>

<script>
    // ==========================================
    // 1. SÉCURITÉ ANTI-TRICHE
    // ==========================================
    document.addEventListener('contextmenu', event => event.preventDefault());

    document.addEventListener('keydown', function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) ||
            (e.ctrlKey && e.key === "u")
        ) {
            e.preventDefault();
            return false;
        }
    });

    // ==========================================
    // 2. LOGIQUE ET DONNÉES CHIFFRÉES
    // ==========================================
    const decoder = (str) => decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    
    const quizData = [
        {
            question: "D'après l'introduction du document, que se passera-t-il si l'être humain continue à consommer et polluer au même rythme ?",
            options: [
                decoder("TG9zIGVmZWN0b3MgZW4gZWwgZWNvc2lzdGVtYSBzZXLDoW4gaXJyZXZlcnNpYmxlcy4="),
                decoder("TEEgVGllcnJhIHNhYnXLIGRlZmVuZGVyc2Ugc29sYS4="),
                decoder("TG9zIHBlbGlncm9zIGRlc2FwYXJhY2Vyw6FuIGdyw6FjZSDDoCBsYSB0ZWNobm9sb2dpZS4=")
            ],
            rationaleCorrect: decoder("wqFNdXkgYmllbiEgTGUgdGV4dGUgaW5kaXF1ZSBleHBsaWNpdGVtZW50IHF1ZSBzaSBsZSByeXRobWUgYWN0dWVsIGNvbnRpbnVlLCBsZXMgZWZmZXRzIHN1ciBsJ8OpY29zeXN0w6htZSBzZXJvbnQgaXJyw6Z2ZXJzaWJsZXMgKCdzZXLDoW4gaXJyZXZlcnNpYmxlcycpLg=="),
            rationaleIncorrect: decoder("wqFFcnJvciEgUmVsaXNleiBsZSBkw6VidXQgZHUgcHJlbWllciBwYXJhZ3JhcGhlIDogbGUgdGV4dGUgaW5zaXN0ZSBzdXIgbGEgZ3Jhdml0w6kgZGUgbGEgc2l0dWF0aW9uLg=="),
            correctIndex: "MA=="
        },
        {
            question: "Quel est l'objectif principal du livre publié par la 'Consejería de Medio Ambiente de la Junta de Andalucía' ?",
            options: [
                decoder("VmVuZGVyIHVuIGxpYnJvIGRpdmVydGlkbyBwYXJhIGxhcyB2YWNhbmNlcy4="),
                decoder("UXVlIGxvcyBtw6FzIHBlcXVlw7FvcyB0b21lbiBjb25jaWVuY2lhIHNvYnJlIGVzdGUgYXN1bnRvLg=="),
                decoder("T3JnYW5pemFyIHVuYSBsaW1waWV6YSBnZW5lcmFsIGVuIGxvcyBwdWVibG9zIGRlIEFuZGFsdWNpYS4=")
            ],
            rationaleCorrect: decoder("wqFFeGFjdG8hIEMnZXN0IHVuIG1veWVuIHNpbXBsZSBldCBhbXVzYW50IGRlIGZhaXJlIHByZW5kcmUgY29uY2llbmNlIGF1eCBwbHVzIGpldW5lcyAoJ3RvbWVuIGNvbmNpZW5jaWEnKSBkZXMgZGFuZ2VycyBxdWkgbWVuYWNlbnQgbGEgcGxhbsOodGUu"),
            rationaleIncorrect: decoder("wqFObyBlcyBjb3JyZWN0byEgUmVnYXJkZXogbGEgZmluIGR1IHByZW1pZXIgcGFyYWdyYXBoZSBwb3VyIGlkZW50aWZpZXIgbCdvYmplY3RpZiBwX2VkYWdvZ2lxdWUu"),
            correctIndex: "MQ=="
        },
        {
            question: "Parmi ces conseils du document, lequel est un ordre affirmatif pour économiser l'eau ?",
            options: [
                decoder("Tm8gdXRpbGljZXMgbG9zIHLDrW9zIG5pIGxvcyBtYXJlcyBjb21vIHVuIGN1Ym8gZGUgYmFzdXJhLg=="),
                decoder("UmVjaWNsYSBlbCBwYXBlbCwgZWwgcGzDoXN0aWNvLCBlbCBtZXRhbCB5IGVsIHZpZHJpby4="),
                decoder("Q2llcnJhIGJpZW4gbG9zIGdyaWZvcy4=")
            ],
            rationaleCorrect: decoder("wqFFeGNlbGVudGUhIENldHRlIHBocmFzZSB1dGlsaXNlIGwnaW1ww6lyYXRpZiBhZmZpcm1hdGlmIGR1IHZlcmJlIGlycsOpZ3VsaWVyIChDaWVycmEpIGV0IGRlbWFuZGUgZGUgYmllbiBmZXJtZXIgbGVzIHJvYmluZXRzICgnZ3JpZm9zJykgcG91ciBuZSBwYXMgZ2FzcGlsbGVyIGwnZWF1Lg=="),
            rationaleIncorrect: decoder("wqFDdWlkYWRvISBDaGVyY2hleiBsJ2FjdGlvbiBsaリアw6llIGRpcmVjdGVtZW50IMOgIGwndXRpbGlzYXRpb24gZGUgbCdlYXUu"),
            correctIndex: "Mg=="
        },
        {
            question: "Que conseille le texte concernant les espaces naturels lors des randonnées ou des sorties ?",
            options: [
                decoder("Tm8gY2FtaW5lcyBmdWVyYSBkZSBsb3Mgc2VuZGVyb3MgbmkgZXNxdcOAdvancedZXMgZnVlcmEgZGUgbGFzIHBpc3Rhcy4="),
                decoder("QXl1ZGEgYSByZXBsYW50YXIgw6FyYm9sZXMgZW4gbWVkaW8gZGUgbGFzIHBpc3RhcyBkZSBlc3F1w60u"),
                decoder("Q2FtaW5hIGxpYnJlbWVudGUgcG9yIGxhIG5hdHVyYWxlemEgcGFyYSBjb25vY2VyIGEgbG9zIGFuaW1hbGVzLg==")
            ],
            rationaleCorrect: decoder("wqFQZXJmZWN0byEgTGUgdGV4dGUgaW50ZXJkaXQgZGUgbWFyY2hlciBob3JzIGRlcyBzZW50aWVycyAoJ3NlbmRlcm9zJykgcG91ciBwcsOpc2VydmVyIGxhIHbDqWfDqXRhdGlvbiBldCBuZSBwYXMgZMOpcmFuZ2VyIGxhIGZhdW5lLg=="),
            rationaleIncorrect: decoder("wqFPam8hIExlIHRleHRlIGRlbWFuZGUgYXUgY29udHJhaXJlIGRlIHN1aXZyZSBkZXMgcsOoZ2xlcyBzdHJpY3RlcyBsb3JzIGRlcyBkw6VwbGFjZW1lbnRzIGRhbnMgbGEgbmF0dXVyZS4="),
            correctIndex: "MA=="
        },
        {
            question: "Quel conseil dénonce le prix fort que paient les animaux juste pour le confort ou la mode humaine ?",
            options: [
                decoder("RGkgwqsKwqFubyEgwrsuIGEgbGEgbWF0YW56YSBkZSBhbmltYWxlcyBwYXJhIGNvbmZlY2Npb25hciBhYnJpZ29zLg=="),
                decoder("Tm8gbW9sZXN0YXLDoXMgYSBsb3MgYW5pbWFsZXMu"),
                decoder("QXl1ZGEgYSBsYSBjb25zZXJ2YWNpw7NuIGRlIGxhcyBlc3BlY2llcyBlbiBwZWxpZ3JvLg==")
            ],
            rationaleCorrect: decoder("wqFFeGNlbGVudGUhICdMYSBtYXRhbHphJyBzaWduaWZpZSBsZSBtYXNzYWNyZS9sYSB0dWVyaWUsIGV0ICdsb3MgYWJyaWdvcyBkZSBwaWVsJyBzb250IGxlcyBtYW50ZWF1eCBkZSBmb3VycnVyZS4="),
            rationaleIncorrect: decoder("wqFFcnJvciEgUmVsaXNleiBiaWVuIGxlcyBkZXJuaWVycyBjb25zZWlscyBkdSBkb2N1bWVudCBwb3VyIHRyb3V2ZXIgY2VsdWkgcXVpIHBhcmxlIGV4cGxpY2l0ZW1lbnQgZGVzIHbDqnRlbWVudHMu"),
            correctIndex: "MA=="
        }
    ];

    let currentQuestionIndex = 0;
    let correctAnswersCount = 0; 
    
    function loadQuestion() {
        const currentQuiz = quizData[currentQuestionIndex];
        const progressPercent = (currentQuestionIndex / quizData.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';
        document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${currentQuiz.question}`;
        
        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';
        
        document.getElementById('next-btn').style.display = 'none';
        const fbBox = document.getElementById('feedback-box');
        fbBox.className = 'feedback';

        currentQuiz.options.forEach((optionText, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = optionText;
            li.onclick = () => selectOption(li, index, currentQuiz);
            optionsList.appendChild(li);
        });
    }
  
    function selectOption(element, selectedIndex, currentQuiz) {
        const allOptions = document.querySelectorAll('.option-item');
        const fbBox = document.getElementById('feedback-box');
        const correctIndex = parseInt(atob(currentQuiz.correctIndex));

        allOptions.forEach(opt => opt.classList.add('disabled'));

        if (selectedIndex === correctIndex) {
            element.classList.add('correct');
            fbBox.innerHTML = currentQuiz.rationaleCorrect;
            fbBox.classList.add('correct-fb', 'show');
            correctAnswersCount++; 
        } else {
            element.classList.add('incorrect');
            fbBox.innerHTML = currentQuiz.rationaleIncorrect;
            fbBox.classList.add('incorrect-fb', 'show');
            allOptions[correctIndex].classList.add('correct');
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            const totalQuestions = quizData.length;
            const errorsCount = totalQuestions - correctAnswersCount;
            
            document.getElementById('progress').style.width = '100%';
            document.getElementById('quiz-screen').style.display = 'none';
            
            const finalScreen = document.getElementById('final-screen');
            
            if (errorsCount <= 1) {
                let felicitacionesMessage = "";
                if (errorsCount === 0) {
                    felicitacionesMessage = "¡Perfecto! Un sinfín de aciertos. Todo un expert ecologista.";
                } else {
                    felicitacionesMessage = "¡Casi perfecto! Una petite distracción, pero habéis demostrado un gran nivel.";
                }

                finalScreen.innerHTML = `
                    <h2>¡Misión Cumplida! 🎉</h2>
                    <p style="font-style: italic; color: #555;">${felicitacionesMessage}</p>
                    <p>Habéis analizado correctamente le document "Tu pueblo es tu planeta".</p>
                    <p>Aquí tenéis el primer elemento para descifrar el código del Escape Game :</p>
                    <div class="code-box">CLÉ : VERDE-95</div>
                    <p style="font-size: 14px; color: #666;">Autenticación validada. Score : ${correctAnswersCount} / ${totalQuestions}. Podéis pasar a la siguiente misión.</p>
                `;
            } else {
                finalScreen.innerHTML = `
                    <h2 style="color: #f44336;">Misión Fallida ❌</h2>
                    <p>Habéis cometido demasiados errores (${errorsCount} fallos) en la comprensión del documento.</p>
                    <p>Un buen ecologista debe ser más preciso. Se permite <b>un solo fallo</b> comme maximum pour valider.</p>
                    <p>Score : ${correctAnswersCount} / ${totalQuestions}</p>
                    <button class="next-btn" style="display:block; margin-top:30px;" onclick="restartQuiz()">🔄 Recomenzar la misión</button>
                `;
            }
            finalScreen.style.display = 'block';
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        correctAnswersCount = 0;
        document.getElementById('final-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    window.onload = loadQuestion;
</script>

</body>
</html>
