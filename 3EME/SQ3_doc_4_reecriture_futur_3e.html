<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> SQ3 - Doc.4 - Réécriture au futur 1ère personne — 3e</title>
<style>
:root{--ink:#24313b;--accent:#df5c6b;--ok:#20875b;--bad:#c84949;--line:#e7dfd1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(135deg,#f9efd7,#f8faf7 48%,#e8f4f1);padding:10px}
.card{max-width:1160px;margin:auto;background:#fffdf8;border:1px solid #eadfca;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #4f5d5d20}
header{padding:12px 22px 10px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff8ed,#fff)}
.top{display:flex;gap:13px;align-items:center}.badge{font-weight:800;background:var(--accent);color:white;padding:7px 12px;border-radius:9px;box-shadow:0 4px 0 #b84655;transform:rotate(-1deg)}
h1{font-size:clamp(21px,2.8vw,29px);margin:0;font-weight:850}.instruction{font-size:16px;margin:8px 0 0}.instruction b{color:#b84655}
main{padding:7px 22px 12px}.row{display:grid;grid-template-columns:31px minmax(0,1fr);align-items:center;gap:7px;padding:5px 0;border-bottom:1px dashed #ded5c8;font-size:clamp(15px,1.65vw,18px)}
.num{font-weight:800;color:#9b5960;text-align:center}.sentence{line-height:1.4}.original{color:#52616a}.arrow{color:#ba6570;font-weight:800;margin:0 5px}.answer{font:inherit;font-weight:650;text-align:center;border:2px solid #cfc6b8;border-radius:9px;background:#fff;padding:5px 7px;outline:none;width:182px;max-width:95%;transition:.15s}.answer:focus{border-color:#d76b76;box-shadow:0 0 0 3px #df5c6b18}.correct{border-color:var(--ok)!important;background:#eaf8f1!important;color:#146743}.wrong{border-color:var(--bad)!important;background:#fff0f0!important;color:#9d3030}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding-top:10px}button{border:0;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 3px 8px #0001}button.primary{background:#d95767;color:#fff}button.secondary{background:#f2c45d;color:#3c3424}button.ghost{background:#edf0ed;color:#39454b}.score{font-size:16px;font-weight:800;margin-left:auto}.perfect{color:var(--ok)}.note{font-size:12px;color:#68757f;margin-top:8px}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99}.piece{position:absolute;top:-30px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(900deg);opacity:.9}}
@media(max-width:700px){body{padding:5px}header{padding:10px 12px}main{padding:6px 12px 10px}.row{grid-template-columns:23px 1fr;font-size:15px}.answer{width:155px}.score{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="card">
<header><div class="top"><span class="badge">Ejercicio</span><h1>Réécriture au futur - 1ère personne du singulier</h1></div><p class="instruction">Réécris les verbes à la <b>1ère personne du singulier sans changer le temps</b> : Voir doc.4 - Próximo destino Perú pour la conjugaison</p></header>
<main>
<div id="exercise"></div>
<div class="actions"><button class="primary" id="check">✓ Vérifier</button><button class="secondary" id="solution">◉ Voir la correction</button><button class="ghost" id="reset">↻ Recommencer</button><span class="score" id="score" aria-live="polite"></span></div>
<div class="note">Astuce : Entrée passe à la réponse suivante. Accents espagnols : á é í ó ú ñ ü</div>
</main></div><div id="confetti"></div>
<script>
// ===== PHRASES À MODIFIER : phrase d'origine, début, réponse, fin =====
const items = [
 ['Descubrirás una antigua ciudad inca [...].','','Descubriré','una antigua ciudad inca [...].'],
 ['Navegarás por el lago.','','Navegaré','por el lago.'],
 ['Visitarás las islas flotantes.','','Visitaré','las islas flotantes.'],
 ['Conocerás las tradiciones de sus habitantes.','','Conoceré','las tradiciones de sus habitantes.'],
 ['Pasearás por sus calles.','','Pasearé','por sus calles.'],
 ['Admirarás sus monumentos.','','Admiraré','sus monumentos.'],
 ['Conocerás la cultura inca.','','Conoceré','la cultura inca.'],
 ['Probarás (o→ue) platos típicos.','','Probaré','platos típicos.'],
 ['Descubrirás nuevos sabores.','','Descubriré','nuevos sabores.']
];
const ex=document.querySelector('#exercise');
const norm=s=>s.trim().toLocaleLowerCase('es').normalize('NFC').replace(/\s+/g,' ');
items.forEach((x,i)=>{
 const r=document.createElement('div');r.className='row';
 const n=document.createElement('div');n.className='num';n.textContent=(i+1)+'.';
 const sentence=document.createElement('div');sentence.className='sentence';
 const orig=document.createElement('span');orig.className='original';orig.textContent=x[0];
 const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';
 const before=document.createElement('span');before.textContent=x[1]?(x[1]+' '):'';
 const inp=document.createElement('input');inp.className='answer';inp.setAttribute('aria-label','Réponse phrase '+(i+1));inp.dataset.answer=x[2];inp.autocomplete='off';inp.spellcheck=false;
 const after=document.createElement('span');after.textContent=' '+x[3];
 sentence.append(orig,arrow,before,inp,after);r.append(n,sentence);ex.appendChild(r);
});
const inputs=[...document.querySelectorAll('.answer')];
inputs.forEach((inp,i)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inputs[(i+1)%inputs.length].focus()}}));
function mark(inp){const ok=norm(inp.value)===norm(inp.dataset.answer);inp.classList.toggle('correct',ok);inp.classList.toggle('wrong',!ok);return ok}
function check(){let good=0;inputs.forEach(i=>{if(mark(i))good++});const total=inputs.length;const score=document.querySelector('#score');score.textContent=`${good} / ${total} réponses correctes`;score.className='score'+(good===total?' perfect':'');if(good===total){score.textContent='🎉 Parfait ! Tout est juste !';celebrate();applause()}}
function solutions(){inputs.forEach(i=>{i.value=i.dataset.answer;i.classList.remove('wrong');i.classList.add('correct')});document.querySelector('#score').textContent='Correction affichée'}
function reset(){inputs.forEach(i=>{i.value='';i.className='answer'});document.querySelector('#score').textContent='';inputs[0].focus()}
document.querySelector('#check').onclick=check;document.querySelector('#solution').onclick=solutions;document.querySelector('#reset').onclick=reset;
function celebrate(){const box=document.querySelector('#confetti'),colors=['#df5c6b','#f3c766','#48a98b','#5578c9','#a95fc4'];box.innerHTML='';for(let i=0;i<130;i++){const p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'vw';p.style.background=colors[i%colors.length];p.style.setProperty('--drift',(Math.random()*240-120)+'px');p.style.animationDuration=(2.3+Math.random()*2.2)+'s';p.style.animationDelay=(Math.random()*.7)+'s';box.appendChild(p)}setTimeout(()=>box.innerHTML='',5200)}
function applause(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();const master=ctx.createGain();master.gain.value=.18;master.connect(ctx.destination);const start=ctx.currentTime;for(let i=0;i<55;i++){const t=start+Math.random()*1.55,dur=.025+Math.random()*.055,buffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),d=buffer.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*(1-j/d.length);const src=ctx.createBufferSource();src.buffer=buffer;const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.value=700+Math.random()*1700;filter.Q.value=.7;const g=ctx.createGain();g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.45+Math.random()*.35,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+dur);src.connect(filter);filter.connect(g);g.connect(master);src.start(t);src.stop(t+dur+.01)}setTimeout(()=>ctx.close(),2300)}
</script>
</body>
</html>
