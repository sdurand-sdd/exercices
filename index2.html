<script>
    // --- CONFIGURATION ---
    const USER = "sdurand-sdd"; 
    const REPO = "exercices"; 
    // ---------------------

    async function init() {
        const main = document.getElementById('main-container');
        try {
            // On utilise l'URL des commits publics (flux RSS/Atom converti en JSON de manière ultra-légère, ou via le miroir de rendu)
            // Pour contourner le blocage immédiat 403 de l'API, on utilise l'API de listing des fichiers via jsDelivr (qui est un miroir gratuit et illimité de votre GitHub)
            const url = `https://data.jsdelivr.com/v1/package/gh/${USER}/${REPO}`;
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error("Impossible de lister les dossiers.");
            }
            
            const data = await response.json();
            main.innerHTML = ""; 

            const structure = {};
            
            // jsDelivr nous donne immédiatement la liste des dossiers à la racine (ex: 3EME, 4EME...)
            // On va boucler sur chaque dossier trouvé pour charger ses fichiers HTML de façon illimitée
            const folderPromises = data.files
                .filter(item => item.type === "directory" && !item.name.startsWith('.'))
                .map(async (folder) => {
                    const folderUrl = `https://data.jsdelivr.com/v1/package/gh/${USER}/${REPO}@main/${folder.name}`;
                    const folderResponse = await fetch(folderUrl);
                    
                    if (folderResponse.ok) {
                        const folderData = await folderResponse.json();
                        
                        folderData.files.forEach(file => {
                            if (file.type === "file" && file.name.endsWith('.html') && file.name !== "index.html") {
                                if (!structure[folder.name]) {
                                    structure[folder.name] = [];
                                }
                                structure[folder.name].push({
                                    path: `${folder.name}/${file.name}`,
                                    fileName: file.name,
                                    folderName: folder.name
                                });
                            }
                        });
                    }
                });

            // On attend que tous les dossiers soient scannés en arrière-plan
            await Promise.all(folderPromises);

            // Génération dynamique de l'affichage HTML (identique à votre version d'origine)
            const sortedFolders = Object.keys(structure).sort();
            
            if (sortedFolders.length === 0) {
                main.innerHTML = "<p style='text-align:center; color:#666;'>Aucun exercice trouvé dans les sous-dossiers.</p>";
                return;
            }

            sortedFolders.forEach(folder => {
                const section = document.createElement('div');
                section.className = 'section-container';
                
                const displayFolderName = folder.replace(/_/g, ' ').replace(/-/g, ' ').toUpperCase();
                const gridId = `grid-${folder.replace(/[^a-z0-9]/gi, '')}`;
                
                section.innerHTML = `<h2 class="folder-title">${displayFolderName}</h2><div id="${gridId}" class="grid"></div>`;
                main.appendChild(section);

                const grid = document.getElementById(gridId);

                structure[folder].forEach(file => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = `https://${USER}.github.io/${REPO}/${file.path}`;
                    card.setAttribute('target', '_blank');
                    
                    let tempTitle = file.fileName
                        .replace('.html', '')
                        .replace(/_/g, ' ')
                        .replace(/-/g, ' ');
                    
                    tempTitle = tempTitle.charAt(0).toUpperCase() + tempTitle.slice(1);
                    card.innerHTML = `<h3>${tempTitle}</h3>`;
                    grid.appendChild(card);
                });
            });

        } catch (error) {
            main.innerHTML = "<p style='text-align:center; color:red;'>Erreur de synchronisation. Vos exercices restent accessibles via leurs liens directs.</p>";
            console.error(error);
        }
    }

    window.onload = init;
</script>
