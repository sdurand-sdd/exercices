<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EG - Medio ambiente : Misión 1 -  CE : Tu pueblo es tu planeta</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --primary-light: #e8f5e9;
            --secondary-color: #388e3c;
            --text-color: #333;
            --bg-color: #f4f7f5;
            --card-bg: #ffffff;
            --correct-color: #4caf50;
            --incorrect-color: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        .progress-bar {
            background-color: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%; 
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            font-weight: 500;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background-color: var(--primary-light);
        }

        .option-item.correct {
            border-color: var(--correct-color);
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .option-item.incorrect {
            border-color: var(--incorrect-color);
            background-color: #ffebee;
            color: #c62828;
        }

        .option-item.disabled {
            pointer-events: none;
        }

        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.3;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct-fb {
            background-color: #e8f5e9;
            border-left: 5px solid var(--correct-color);
            color: #1b5e20;
        }

        .feedback.incorrect-fb {
            background-color: #ffebee;
            border-left: 5px solid var(--incorrect-color);
            color: #b71c1c;
        }

        .next-btn {
            display: none;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background-color: var(--secondary-color);
        }

        .final-screen {
            text-align: center;
            display: none;
        }

        .final-screen h2 {
            color: var(--primary-color);
            font-size: 28px;
        }

        .code-box {
            background-color: #fff9c4;
            border: 2px dashed #fbc02d;
            padding: 8px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="header">
            <h1>🌍 Misión 1: Comprensión lectora</h1>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="question-text" id="question-text">Question...</div>
         
        <ul class="options-list" id="options-list"></ul>

        <div class="feedback" id="feedback-box">Rationale...</div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Siguiente pregunta ➔</button>
    </div>

    <div id="final-screen" class="final-screen"></div>
</div>

<script>
    // ==========================================
    // 1. SÉCURITÉ ANTI-TRICHE
    // ==========================================
    document.addEventListener('contextmenu', event => event.preventDefault());

    document.addEventListener('keydown', function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) ||
            (e.ctrlKey && e.key === "u")
        ) {
            e.preventDefault();
            return false;
        }
    });

    // ==========================================
    // 2. LOGIQUE ET DECODAGE SECURISÉ (UTF-8)
    // ==========================================
    const decoder = (str) => {
        const binaryString = atob(str.replace(/\s/g, ''));
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
    };
    
    const quizData = [
        {
            question: "D'après l'introduction du document, que se passera-t-il si l'être humain continue à consommer et polluer au même rythme ?",
            options: [
                { text: decoder("TG9zIGVmZWN0b3MgZW4gZWwgZWNvc2lzdGVtYSBzZXLDoW4gaXJyZXZlcnNpYmxlcy4="), isCorrect: "dHJ1ZQ==" },
                { text: decoder("TGEgVGllcnJhIHNhYnLDoSBkZWZlbmRlcnNlIHNvbGEu"), isCorrect: "ZmFsc2U=" },
                { text: decoder("TG9zIHBlbGlncm9zIGRlc2FwYXJhY2Vyw6FuIGdyw6FjaWVzIGEgbGEgdGVjbm9sb2fDrGEu"), isCorrect: "ZmFsc2U=" }
            ],
            rationaleCorrect: "¡Muy bien! Le texte indique explicitement que si le rythme actuel continue, les effets sur l'écosystème seront irréversibles ('serán irreversibles').",
            rationaleIncorrect: "¡Error! Relisez le début du premier paragraphe : le texte insiste sur la gravité de la situation.",
            correctIndex: 0
        },
        {
            question: "Quel est l'objectif principal du livre publié par la 'Consejería de Medio Ambiente de la Junta de Andalucía' ?",
            options: [
                { text: decoder("VmVuZGVyIHVuIGxpYnJvIGRpdmVydGlkbyBwYXJhIGxhcyB2YWNhbmNlcy4="), isCorrect: "ZmFsc2U=" },
                { text: decoder("UXVlIGxvcyBtw6FzIHBlcXVlw7FvcyB0b21lbiBjb25jaWVuY2lhIHNvYnJlIGVzdGUgYXN1bnRvLg=="), isCorrect: "dHJ1ZQ==" },
                { text: decoder("T3JnYW5pemFyIHVuYSBsaW1waWV6YSBnZW5lcmFsIGVuIGxvcyBwdWVibG9zIGRlIEFuZGFsdWNpYS4="), isCorrect: "ZmFsc2U=" }
            ],
            rationaleCorrect: "¡Exacto! C'est un moyen simple et amusant de faire prendre conscience aux plus jeunes ('tomen conciencia') des dangers qui menacent la planète.",
            rationaleIncorrect: "¡No es correcto! Regardez la fin du premier paragraphe pour identifier l'objectif pédagogique.",
            correctIndex: 1
        },
        {
            question: "Parmi ces conseils du document, lequel est un ordre affirmatif pour économiser l'eau ?",
            options: [
                { text: decoder("Tm8gdXRpbGljZXMgbG9zIHLDrW9zIG5pIGxvcyBtYXJlcyBjb21vIHVuIGN1Ym8gZGUgYmFzdXJhLg=="), isCorrect: "ZmFsc2U=" },
                { text: decoder("UmVjaWNsYSBlbCBwYXBlbCwgZWwgcGzDoXN0aWNvLCBlbCBtZXRhbCB5IGVsIHZpZHJpby4="), isCorrect: "ZmFsc2U=" },
                { text: decoder("Q2llcnJhIGJpZW4gbG9zIGdyaWZvcy4="), isCorrect: "dHJ1ZQ==" }
            ],
            rationaleCorrect: "¡Excelente! Cette phrase utilise l'impératif affirmatif du verbe irrégulier (Cierra) et demande de bien fermer les robinets ('grifos') pour ne pas gaspiller l'eau.",
            rationaleIncorrect: "¡Cuidado! Cherchez l'action liée directement à l'utilisation de l'eau.",
            correctIndex: 2
        },
        {
            question: "Que conseille le texte concernant les espaces naturels lors des randonnées ou des sorties ?",
            options: [
                { text: decoder("Tm8gY2FtaW5lcyBmdWVyYSBkZSBsb3Mgc2VuZGVyb3MgbmkgZXNxdcOtc2VzIGZ1ZXJhIGRlIGxhcyBwaXN0YXMu"), isCorrect: "dHJ1ZQ==" },
                { text: decoder("QXl1ZGEgYSByZXBsYW50YXIgw6FyYm9sZXMgZW4gbWVkaW8gZGUgbGFzIHBpc3RhcyBkZSBlc3F1w60u"), isCorrect: "ZmFsc2U=" },
                { text: decoder("Q2FtaW5hIGxpYnJlbWVudGUgcG9yIGxhIG5hdHVyYWxlemEgcGFyYSBjb25vY2VyIGEgbG9zIGFuaW1hbGVzLg=="), isCorrect: "ZmFsc2U=" }
            ],
            rationaleCorrect: "¡Perfecto! Le texte interdit de marcher hors des sentiers ('senderos') pour préserver la végétation et ne pas déranger la faune.",
            rationaleIncorrect: "¡Ojo! Le texte demande au contraire de suivre des règles strictes lors des déplacements dans la nature.",
            correctIndex: 0
        },
        {
            question: "Quel conseil dénonce le prix fort que paient les animaux juste pour le confort ou la mode humaine ?",
            options: [
                { text: decoder("RGkgwqFubyEgYSBsYSBtYXRhbnphIGRlIGFuaW1hbGVzIHBhcmEgY29uZmVjY2lvbmFyIGFicmlnb3Mu"), isCorrect: "dHJ1ZQ==" },
                { text: decoder("Tm8gbW9sZXN0YXLDoXMgYSBsb3MgYW5pbWFsZXMu"), isCorrect: "ZmFsc2U=" },
                { text: decoder("QXl1ZGEgYSBsYSBjb25zZXJ2YWNpw7NuIGRlIGxhcyBlc3BlY2llcyBlbiBwZWxpZ3JvLg=="), isCorrect: "ZmFsc2U=" }
            ],
            rationaleCorrect: "¡Excelente! 'La matanza' désigne le massacre/la tuerie, et 'los abrigos' fait référence aux vêtements/manteaux de fourrure.",
            rationaleIncorrect: "¡Error! Relisez bien les derniers conseils du document pour trouver celui qui parle explicitement des vêtements.",
            correctIndex: 0
        }
    ];

    let currentQuestionIndex = 0;
    let correctAnswersCount = 0; 
    
    function loadQuestion() {
        const currentQuiz = quizData[currentQuestionIndex];
        const progressPercent = (currentQuestionIndex / quizData.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';
        document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${currentQuiz.question}`;
        
        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';
        
        document.getElementById('next-btn').style.display = 'none';
        const fbBox = document.getElementById('feedback-box');
        fbBox.className = 'feedback';

        currentQuiz.options.forEach((option, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = option.text;
            li.onclick = () => selectOption(li, index, currentQuiz);
            optionsList.appendChild(li);
        });
    }
  
    function selectOption(element, selectedIndex, currentQuiz) {
        const allOptions = document.querySelectorAll('.option-item');
        const fbBox = document.getElementById('feedback-box');
        const correctIndex = currentQuiz.correctIndex;

        allOptions.forEach(opt => opt.classList.add('disabled'));

        if (selectedIndex === correctIndex) {
            element.classList.add('correct');
            fbBox.innerHTML = currentQuiz.rationaleCorrect;
            fbBox.classList.add('correct-fb', 'show');
            correctAnswersCount++; 
        } else {
            element.classList.add('incorrect');
            fbBox.innerHTML = currentQuiz.rationaleIncorrect;
            fbBox.classList.add('incorrect-fb', 'show');
            allOptions[correctIndex].classList.add('correct');
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            const totalQuestions = quizData.length;
            const errorsCount = totalQuestions - correctAnswersCount;
            
            document.getElementById('progress').style.width = '100%';
            document.getElementById('quiz-screen').style.display = 'none';
            
            const finalScreen = document.getElementById('final-screen');
            
            if (errorsCount <= 1) {
                let felicitacionesMessage = "";
                if (errorsCount === 0) {
                    felicitacionesMessage = "¡Perfecto! Un sinfín de aciertos. Todo un expert ecologista.";
                } else {
                    felicitacionesMessage = "¡Casi perfecto! Una pequeña distracción, mais vous avez démontré un grand niveau.";
                }

                finalScreen.innerHTML = `
                    <h2>¡Misión Cumplida! 🎉</h2>
                    <p style="font-style: italic; color: #555;">${felicitacionesMessage}</p>
                    <p>Habéis analizado correctamente el documento "Tu pueblo es tu planeta".</p>
                    <p>Aquí tenéis el premier élément pour décoder le code de l'Escape Game :</p>
                    <div class="code-box">CLÉ : VERDE-95</div>
                    <p style="font-size: 14px; color: #666;">Autenticación validada. Score : ${correctAnswersCount} / ${totalQuestions}. Vous pouvez passer à la suite.</p>
                `;
            } else {
                finalScreen.innerHTML = `
                    <h2 style="color: #f44336;">Misión Fallida ❌</h2>
                    <p>Habéis cometido demasiados errores (${errorsCount} fallos) en la comprensión del documento.</p>
                    <p>Un buen ecologista debe ser más preciso. Se permite <b>un solo fallo</b> como máximo para validar.</p>
                    <p>Score : ${correctAnswersCount} / ${totalQuestions}</p>
                    <button class="next-btn" style="display:block; margin-top:30px;" onclick="restartQuiz()">🔄 Recomenzar la misión</button>
                `;
            }
            finalScreen.style.display = 'block';
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        correctAnswersCount = 0;
        document.getElementById('final-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    window.onload = loadQuestion;
</script>

</body>
</html>
