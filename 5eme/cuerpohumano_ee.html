const inputs=()=>[...sheet.querySelectorAll('input')];let celebrated=false;
function applause(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();let t=ctx.currentTime;for(let i=0;i<22;i++){let n=ctx.createBuffer(1,Math.round(ctx.sampleRate*.07),ctx.sampleRate),d=n.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);let s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=n;g.gain.value=.09;s.connect(g).connect(ctx.destination);s.start(t+i*.052)}setTimeout(()=>ctx.close(),2200)}catch(e){}}
function burst(){const c=document.querySelector('#confetti'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let p=Array.from({length:170},()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.8,v:2+Math.random()*4,w:4+Math.random()*7,h:5+Math.random()*8,a:Math.random()*6.28,spin:(Math.random()-.5)*.15,col:['#f45b86','#fbc531','#28c3b7','#7c66d9','#42a5f5'][Math.floor(Math.random()*5)]}));let frame=0;function draw(){ctx.clearRect(0,0,c.width,c.height);for(const z of p){z.y+=z.v;z.x+=Math.sin(z.a)*.9;z.a+=z.spin;ctx.fillStyle=z.col;ctx.save();ctx.translate(z.x,z.y);ctx.rotate(z.a);ctx.fillRect(-z.w/2,-z.h/2,z.w,z.h);ctx.restore()}if(++frame<180)requestAnimationFrame(draw);else ctx.clearRect(0,0,c.width,c.height)}draw()}
document.querySelector('#check').onclick=()=>{let ok=0;inputs().forEach((inp,i)=>{const good=items[i].answers.some(v=>norm(v)===norm(inp.value));inp.classList.toggle('ok',good);inp.classList.toggle('bad',!good);if(good)ok++});msg.textContent=ok===items.length?'🎉 ¡Excelente! ¡Todas las respuestas son correctas!':`${ok} / ${items.length} correctas. Corrige las casillas rosas.`;if(ok===items.length&&!celebrated){celebrated=true;applause();burst()}};
document.querySelector('#reset').onclick=()=>{inputs().forEach(inp=>{inp.value='';inp.classList.remove('ok','bad')});celebrated=false;msg.textContent='Completa las 14 palabras y verifica tus respuestas.';inputs()[0].focus()};
document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
</script></body></html>
