FXT+xUUUgKLd6ywv8rWYOwoooKU/kvFdqKKKSEhf//Z);background-size:100% 100%;background-repeat:no-repeat}.spot{position:absolute;transform:translate(-50%,-50%);width:6.1%;aspect-ratio:1;border:2px solid #f13b69;border-radius:50%;background:#fffefa;display:flex;align-items:center;justify-content:center;color:#a50e5e;font-size:clamp(10px,1.5vw,19px);font-weight:900;cursor:pointer;touch-action:none}.spot.filled{background:#fce6f3;border-color:#ba2a86}.spot.correct{background:#dff7e5;border-color:#299e5c;color:#14703e}.spot.wrong{background:#ffe0e5;border-color:#df4a60;color:#9c263a}.status{min-height:18px;font-size:12px;color:#865070;text-align:center}.foot{font-size:11px;color:#786b79;text-align:center}@media(max-width:650px){.app{padding:4px;gap:3px}.main{grid-template-columns:minmax(84px,23%) minmax(0,1fr);gap:4px}.bank{padding:4px}.tile{font-size:clamp(10px,2vw,15px);border-radius:5px}.spot{border-width:1px}.foot{display:none}.top strong{font-size:12px}.action{padding:4px 6px;font-size:10px}}
</style></head><body><div class="app"><div class="top"><strong>De pies a cabeza · Correction</strong><div class="actions"><button class="action" id="check">✓ Vérifier</button><button class="action" id="reset">↻ Recommencer</button><button class="action" id="full">⛶ Plein écran</button></div></div><div class="main"><aside class="bank"><div class="bank-head"><span>Números</span><span id="count">0 / 13</span></div><div class="tiles" id="tiles"></div></aside><section class="board"><div class="canvas" id="canvas"></div></section></div><div class="status" id="status" aria-live="polite">Glisse un numéro dans un cercle, ou sélectionne-le puis touche le cercle.</div></div><script>
const SPOTS=[{"n": 1, "x": 15.022, "y": 33.701}, {"n": 17, "x": 36.406, "y": 33.701}, {"n": 13, "x": 56.32, "y": 19.451}, {"n": 8, "x": 93.876, "y": 33.407}, {"n": 9, "x": 18.497, "y": 59.998}, {"n": 7, "x": 40.683, "y": 69.106}, {"n": 4, "x": 63.403, "y": 52.505}, {"n": 5, "x": 94.143, "y": 56.325}, {"n": 2, "x": 18.764, "y": 80.565}, {"n": 10, "x": 36.138, "y": 92.758}, {"n": 16, "x": 67.145, "y": 92.758}, {"n": 15, "x": 74.095, "y": 69.987}, {"n": 11, "x": 86.926, "y": 89.82}];
const order=[1,2,4,5,7,8,9,10,11,13,15,16,17];
const positions=new Map(SPOTS.map(s=>[s.n,s]));let placed=new Map(),selected=null;
const tiles=document.getElementById('tiles'),canvas=document.getElementById('canvas'),status=document.getElementById('status'),count=document.getElementById('count');
function assign(n,target){if(n==null)return;for(const [key,value] of placed){if(value===n)placed.delete(key)}placed.set(target,n);selected=null;render()}
function render(){tiles.innerHTML='';for(const n of order){const t=document.createElement('button');t.className='tile'+([...placed.values()].includes(n)?' used':'')+(selected===n?' selected':'');t.textContent=n;t.draggable=true;t.dataset.n=n;t.addEventListener('click',()=>{selected=selected===n?null:n;render()});t.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',String(n));e.dataTransfer.effectAllowed='move'});t.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;let x=e.clientX,y=e.clientY;const up=ev=>{document.removeEventListener('pointerup',up);const el=document.elementFromPoint(ev.clientX,ev.clientY);const s=el?.closest('.spot');if(s&&Math.hypot(ev.clientX-x,ev.clientY-y)>8)assign(n,Number(s.dataset.target))};document.addEventListener('pointerup',up)});tiles.appendChild(t)}canvas.innerHTML='';for(const s of SPOTS){const d=document.createElement('button');d.className='spot'+(placed.has(s.n)?' filled':'');d.style.left=s.x+'%';d.style.top=s.y+'%';d.dataset.target=s.n;d.textContent=placed.get(s.n)??'';d.title='Emplacement à compléter';d.addEventListener('click',()=>{if(selected!==null)assign(selected,s.n);else if(placed.has(s.n)){placed.delete(s.n);render()}});d.addEventListener('dragover',e=>e.preventDefault());d.addEventListener('drop',e=>{e.preventDefault();const n=Number(e.dataTransfer.getData('text/plain'));if(order.includes(n))assign(n,s.n)});canvas.appendChild(d)}count.textContent=placed.size+' / 13'}
document.getElementById('check').onclick=()=>{let ok=0;document.querySelectorAll('.spot').forEach(el=>{const n=Number(el.dataset.target);if(!placed.has(n))return;const good=placed.get(n)===n;el.classList.add(good?'correct':'wrong');if(good)ok++});status.textContent=ok===13?'¡Excelente! Todas las respuestas son correctas. 🎉':ok+' respuesta(s) correcta(s) de 13. Corrige las casillas en rose.'};
document.getElementById('reset').onclick=()=>{placed.clear();selected=null;status.textContent='À vous de jouer !';render()};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};render();
</script></body></html>
